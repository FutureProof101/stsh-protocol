# =============================================================================
# STSH — GATE TOOL CENSUS  (remediation lane R-3b, campaign §5 G-e)
# =============================================================================
#
# EVERY tracked entry directly under `scripts/` — file or directory alike, with
# NO exclusion by shape — is either invoked by `run_gate.sh` DIRECTLY, on a line
# that names the tool literally, in a recognised BLOCKING form, or is listed
# here with a reason and an owner as deliberately not. The class this exists to
# stop is "a check whose only catcher is a binary the gate does not run, or runs
# but does not actually fail on."
#
# `invoked_by_gate = true` is NOT satisfied by naming the tool. It requires,
# all of, checked live against `run_gate.sh` BY CONTENT and never by line
# number (tests/gate_tool_census.rs):
#
#   (e) INVOCATION      — a physical line whose command word and argument
#                         tokens identify this tool.
#   (f) BLOCKING FORM   — form (a) `if ! <invocation>` with a `die` /
#                         `verdict_fail` reachable on the failure path inside
#                         the matching `fi`, or form (b) `<invocation> || die`
#                         with the terminator as the immediate right-hand
#                         operand — and NOT caught by a disqualifier
#                         (`if false`, `if 0`, a heredoc-comment wrapper).
#   (g) TERMINATOR BODY — the cited terminator's LIVE body, extracted by brace
#                         depth and both executed and read, actually exits
#                         nonzero. A name is not a behaviour.
#   (h) COMMAND RESOLUTION — that body terminates with the literal
#                         `builtin exit <nonzero>`, and `run_gate.sh` as a whole
#                         contains none of the constructs that could shadow it.
#   (i) PROCESS ENVIRONMENT — `run_gate.sh` opens with the self-sanitising
#                         preamble, so no function or variable imported from a
#                         parent shell reaches any of the above.
#
# NO npm `pre<script>`/`post<script>` hook is EVER credited as evidence, resolved
# or not: `ignore-scripts` lets npm run a named script while silently
# suppressing its hooks, and that state is not observable from file content.
#
# Regenerate the entry list with `git ls-files scripts/` (direct entries only).
#
# DIRECTORY ROWS (R-L post-merge rebase). An uncrated directory under `scripts/`
# is a rule-(c) TOOL directory when any nested tracked file is a tool (tool
# extension or shebang), and a rule-(d) DATA directory when none is. The bar is
# enforced in both directions by tests/gate_tool_census.rs: a directory holding
# a tool CANNOT claim `kind = "data"`, and a data directory must be
# `invoked_by_gate = false` and must name a tool that has its own census row in
# its `reason` — so committed data cannot be orphaned either.
# =============================================================================

schema_version = 1

