[[binding]]
id         = "A66-DOMAIN-VERSION"
property   = "poseidon4_core"
status     = "closed"
bound      = "domain_hash_matches_d2_ceremony"
test_crate = "stsh-poseidon-wasm"
test_file  = "circuits/poseidon-wasm/src/lib.rs"

# A66-VK-CHAIN — PROVES: the ACTUAL DPOOL-9 committed-artifact lock detects a
#   one-byte-tampered verification_key.json, by invoking it over a good repo
#   root and a shadow root and asserting the two verdicts differ. Deliberately
#   NOT sha256_hex: a generic hash-collision demonstration would prove
#   collision-resistance, not that this lane's pin chain is wired. DOES NOT
#   PROVE: that every OTHER copy of the VK digest in the tree moved — that is
#   the packet's zero-hits re-grep.
[[binding]]
id         = "A66-VK-CHAIN"
property   = "check_vk_artifact_pin"
status     = "closed"
bound      = "test_dpool9_vk_pin_detects_tampered_artifact"
test_crate = "verify-genesis-manifest"
test_file  = "scripts/verify_genesis_manifest/src/lib.rs"
