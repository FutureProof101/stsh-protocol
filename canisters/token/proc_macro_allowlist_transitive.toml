# proc_macro_allowlist_transitive.toml — R-1 S4(b3-transitive).
#
# `stsh_token`'s RESOLVED-but-not-DIRECT proc-macro dependency set: every package
# reachable from `stsh_token` via normal-or-build edges in
# `cargo metadata --format-version 1 --offline --locked`'s resolve graph that
# carries a `proc-macro` target, MINUS the DIRECT set
# (proc_macro_allowlist_direct.toml), so the two files partition the resolved set
# with no overlap and no gap.
#
# A `path`/`git` source with no `checksum` field in Cargo.lock is an
# unconditional RED regardless of allowlist membership.
#
# R-1 PACKET DEVIATION (recorded, not silent): the brief's §8 cross-check
# (`cargo tree -p stsh_token -e normal,build | grep '(proc-macro)'`) reports SEVEN
# packages at base and the lint's own specified source — the `cargo metadata`
# resolve graph — reports EIGHT. The extra one is `zeroize_derive`:
# `cargo metadata` emits ONE workspace-wide, feature-UNIFIED resolve graph, in
# which `generic-array`'s optional `zeroize` feature is on (enabled by another
# workspace member), so `sha2 → digest → block-buffer → generic-array → zeroize →
# zeroize_derive` is present; `cargo tree -p stsh_token -i zeroize` reports
# zeroize unreachable from the token under per-package feature resolution. The
# metadata graph is a strict SUPERSET, so pinning it is strictly stronger than
# pinning the cargo-tree set — it is listed here rather than dropped.
#
# Reviewed data. Never auto-derived, never regenerated by the gate.

