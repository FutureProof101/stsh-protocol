# ── HARDEN-03 (2026-09-17) — THE PROCEDURE GAINS A TREE-SHAPE GUARD ──────────
#
# ADDITIVE, and no digest moved. The pipeline above is unchanged, is still the
# definition of every `sha256` recorded in this section, and still reproduces
# them exactly. What is added is a REFUSAL that must be run BEFORE it, because
# the pipeline alone is SILENT about entries that `-type f` does not match:
#
#   cd wallet && [ -z "$(find dist \! -type f \! -type d -print -quit)" ] \
#     || { echo "REFUSED: wallet/dist contains a non-regular entry"; exit 1; }
#
# WHY THE GUARD IS PART OF THE PROCEDURE. `find` defaults to `-P` (never
# dereference), so:
#
#   * a symlink to a REAL file is `-type l`, and `-type f` OMITS it — the digest
#     would not cover a file that ships inside the measured tree;
#   * a symlinked DIRECTORY is likewise not descended, so nothing under it is
#     covered either;
#   * a DANGLING symlink (target absent) is skipped SILENTLY, and the pipeline
#     still produces a perfectly ordinary-looking digest.
#
# An omitted file is exactly as dangerous as a doubled one, so the resolution is
# neither to dereference these nor to ignore them: the measurement REFUSES a tree
# that contains one, and the tree is fixed before it is measured.
#
# THE CHECKER IMPLEMENTS THE SAME REFUSAL, which is what keeps the two paths
# reproductions of one another rather than two procedures that agree only on
# trees that happen to be clean. `verify_custody_manifest`'s `measure_bundle_dir`
# walks with `symlink_metadata` — so a dangling link is reported AS a link rather
# than failing to stat, which is the case the two paths previously disagreed
# about most sharply (the shell skipped it; the checker aborted with an opaque
# `cannot stat` that reads like a disk fault) — and makes any entry that is not a
# regular file or a real directory a hard error naming the offending entry:
# symlinks, symlinked directories (which also closes the directory-cycle case),
# FIFOs, sockets and device nodes.
#
# NO RECORDED DIGEST IS AFFECTED. A released `wallet/dist` is expected to be
# ordinary files and directories only, and at the time of writing it contains
# none of the above (`find wallet/dist -type l` and
# `find wallet/dist \! -type f \! -type d` are both empty). Both pins in this
# file were re-measured under the guarded procedure and under the fixed checker
# and are UNCHANGED: `[wallet_bundle]` 74dd2180… (11 files / 14,103,504 bytes)
