# =============================================================================
# STSH — BINDING REGISTRY (remediation lane R-L, campaign §5 G-c)
# =============================================================================
#
# THE BINDING TEST IS THE EVIDENCE. There is no evidence-file field, no office
# path, no sha256 pinning of a review document, and none may be reintroduced —
# `verify_gate_lints bindings` REFUSES the schema outright if one appears
# (AC-7g), rather than merely ignoring it. A binding proved by a document in a
# directory the gate cannot read is not proved in this repo.
#
# For every row, the lint checks, structurally, that the named test:
#   (a) EXISTS in the named file;
#   (b) carries a `BINDING: <id>` marker comment above it;
#   (c) invokes `property` AT LEAST TWICE with DIFFERING arguments and asserts
#       an inequality or a rejection — the shape of a binding demonstration;
#   (d) is not `#[ignore]`d, with or without a reason;
#   (e) lives in a crate whose suite `run_gate.sh` actually invokes, checked by
#       a CENSUS of the committed script's content — the invocation must appear
#       at command position in a simple command, not merely as bytes somewhere
#       in the file (a commented, quoted or here-doc'd copy runs nothing).
#
# WHAT THIS DOES NOT PROVE, stated plainly (brief §3 OUT): the lint checks the
# SHAPE of the demonstration, never the truth of the binding it claims. That a
# test varies an input and observes a differing/refused outcome does not make
# the property it names the one actually bound. Only review of the test does.
#
# `posture = "launch"` additionally requires every row to be `closed`.
# R-3b's `[deploy_gate]` partition is the deployment-side counterpart of the
# same posture key; whichever lane lands second reconciles the two.

schema_version = 1
posture        = "prelaunch"

# Ids that MUST have a row. Same reasoning as the ceiling registry's
# `required_rows`: without this, deleting row B-2 is a mutation the lint reports
# zero findings for (AC-7/M7a).
required_bindings = [
  "B-1", "B-2", "B-3", "B-4",
  "B-2-VERIFIER-PAIRING", "B-2-VERIFIER-PAIRING-678", "B-4-CEREMONY-ANCHOR",
  "B-1-ACTION", "B-1-EPOCH", "B-1-EXPIRY",
  "B-5-REBOOTSTRAP-SIGNATURE",
  "B-3-INTENT-DESTINATION", "B-3-INTENT-SUBACCOUNT",
  "B-6-STAGE-BEFORE-FINALIZE",
  "B-R3A-RELEASE-HASH-10", "B-R3A-STRING-API-PRIVATE", "B-R3A-CLI-POSTURE",
  "B-RL2-CENSUS-BY-CONTENT", "B-RL2-MEASURED-PROPERTY", "B-RL2-TARGET-KEY-FIXTURES",
  "A66-POOL-MIRROR", "A66-FEE-FLOOR", "A66-DOMAIN-VERSION", "A66-VK-CHAIN",
]

