# ── WHAT THE GATE TRUSTS (TCB) ───────────────────────────────────────────────
#
# Named explicitly, per CTO_RULING_LINT_TCB_BOUNDARY_2026-09-04 item 3: a
# residual named here is closed; one not named here is open.
#
#  * The `bash`, `env`, and coreutils BINARIES resolved at the moment
#    `./run_gate.sh` is first invoked — to honour `env -i`, `--noprofile
#    --norc`, and to report the post-re-exec assertion's four questions
#    HONESTLY. The preamble reduces its exposure by invoking every external
#    command through an absolute path (a word containing a slash is never
#    subject to shell-function lookup), but a modified binary still lies to it.
#  * The kernel's `exec`/`fork` semantics that make `env -i`'s start-from-nothing
#    guarantee actually hold.
#  * THREE SHELL BUILTINS IN THE RE-EXEC LINE: `exec`, `[` and `test`. A builtin
#    has no absolute-path form, so these three command words cannot be
#    slash-qualified the way `/usr/bin/env` and `/bin/bash` are, and bash
#    resolves a FUNCTION of the same name ahead of the builtin. A parent that
#    exports a function named `exec`, `[` or `test` can therefore intercept the
#    single line that performs sanitisation. Graded NOTE under ruling item 1:
#    it is the irreducible floor of an in-script design, it is not reachable
#    without the parent deliberately exporting one of those three names, and
#    the post-re-exec assertion below still fires on the resulting dirty
#    process for the `[`/`test` cases. THIS RESIDUAL IS NAMED, THEREFORE CLOSED.
#    (What is NOT in the TCB, and was in V1's: `builtin`, `compgen`, `unset`,
#    `printf`, `shift`. V1 routed its re-exec DECISION through `builtin`, and
#    SSA_LANDED_DIFF_R-3b_V1_2026-09-05 RED-1 showed an ordinary exported
#    `builtin()` function suppressed both the re-exec and the `builtin exit 1`
#    terminators. V2's decision is unconditional and argv-keyed, so no probe
#    runs before sanitisation and none of those names is load-bearing for it.)
#  * A PARENT THAT INVOKES `./run_gate.sh --stsh-sanitised` ITSELF. The marker
#    is ARGV, not environment: `export STSH_GATE_SANITISED=1` is inert, but a
#    caller passing the literal argument suppresses the re-exec. That is a
#    deliberate act by whoever runs the gate, not something a parent can arrange
#    by exporting a variable or a function. It is also largely unprofitable: the
#    post-re-exec assertion then runs against the unsanitised process and dies
#    on (a)/(b)/(d). Graded NOTE. CI RUNNERS MUST NOT PASS `--stsh-sanitised`.
#  * `BASH_ENV` / `ENV` STARTUP FILES. A non-interactive bash sources the file
#    `BASH_ENV` names BEFORE this script's first line, and `--noprofile`/`--norc`
#    do NOT suppress it. Such a file can redefine `exec` itself, which bash
#    resolves as a function ahead of the builtin, so no in-script construct
#    survives it. `BASH_ENV` is not in the `env -i` list and so is dropped on
#    re-exec, and the post-re-exec assertion's condition (c) makes a surviving
#    `BASH_ENV` fatal — but a `BASH_ENV` that redefines `exec` remains a TCB
#    residual, graded NOTE under ruling item 1. THE CI GATE RUNNER MUST NOT SET
#    `BASH_ENV`.
#  * A `PATH` manipulation, or an `exec`'d wrapper calling a different
#    `run_gate.sh`, performed BEFORE the gate is invoked at all.
#  * The PATH-resolved toolchain (cargo, rustc, dfx, node, npm, git) every later
#    stage invokes.
#
# NO ENVIRONMENT VALUE the gate reads is trusted for the sanitisation decision.
# The decision is `[ "${1:-}" = "--stsh-sanitised" ]` — an ARGV test — and
# everything else re-execs UNCONDITIONALLY under `/usr/bin/env -i /bin/bash
# --noprofile --norc`. The four live-state conditions still exist, but as a
# POST-RE-EXEC ASSERTION that aborts the gate, never as the trigger: there is no
# check a parent can shadow into skipping sanitation, because sanitation happens
# before any check runs. That inversion is the fix for RED-1.

