# ═════════════════════════════════════════════════════════════════════════════
# R2-1 §2(c) — deliberately-published reporting surfaces, enrolled BY STRUCT.
#
# One class-row per struct, each stating its publication rationale and its
# reviewed `field_count`. THE COUNT IS A DRIFT LOCK: a silently added raw-amount
# field changes it and REDs the gate, which is what stops a class-row from
# becoming a blanket licence. A removed field REDs too — a row that no longer
# describes its surface is not a reviewed statement about it.
#
# Attribution is to the OUTERMOST struct named after `->::`, so a field on a
# nested struct is locked twice: once under its own row, once under the page or
# projection that carries it. Counts are therefore per-boundary-path, not per
# distinct field, and 5/6, 12/13 and 4/17 are deliberately NOT merged.
#
# Same authorship chain as §2(b) above: A1 authored (e652239eb19d93f8), SSA-1
# approved, Builder-1 enrolled mechanically.
# ═════════════════════════════════════════════════════════════════════════════
