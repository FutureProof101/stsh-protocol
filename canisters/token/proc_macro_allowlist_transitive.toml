# ── HARDEN-02 (2026-09-17): a NEW transitive proc-macro edge, reviewed ────────
#
# WHY IT APPEARED. HARDEN-02-CODE adds `ic-cdk-timers = "0.10"` to
# `canisters/token/Cargo.toml` — one canister-owned maintenance timer for the H-01
# allowance reclamation, reusing the version already resolved in this workspace
# for `shielded-pool` and `smoke-alarm-monitor`. The resolved edge, traced with
# `cargo tree -p stsh_token -e normal,build -i futures-macro`:
#
#   futures-macro 0.3.32 (proc-macro)
#     └── futures-util 0.3.32
#         ├── futures 0.3.32
#         │     └── ic-cdk-timers 0.10.1
#         │           └── stsh_token
#         └── futures-executor 0.3.32 → futures (*)
#
# TRANSITIVE, not direct: `stsh_token` names `ic-cdk-timers`, never `futures` and
# never `futures-macro`, so the row belongs in this file and not in
# proc_macro_allowlist_direct.toml — which is the partition this pair of files
# maintains.
#
# WHAT IT IS. `futures-macro` provides the `join!` / `select!` / `try_join!`
# macros of the `futures` facade. The token's own source uses none of them: it
# calls `ic_cdk_timers::{set_timer_interval, clear_timer}` and nothing else from
# that subtree. The crate is compiled because it is in the resolved graph, not
# because this canister expands anything from it.
#
# WHY IT IS ACCEPTED RATHER THAN AVOIDED. The alternative to a timer is a
# write-path-only reclamation trigger, and SSA's N-2 finding is precisely that such
# a trigger leaves a burst-then-silence backlog resident: reclamation is coupled to
# traffic that has stopped.
# MEASURED: timer_drains_a_backlog_with_no_further_calls
# The addendum rules one canister-owned timer,
# reusing this exact pinned version rather than introducing a second timer library.
# The dependency is the cost of that ruling, and it is recorded here at its
# resolved version and checksum so a version bump or a checksum change is a RED in
# its own reviewed commit — which is what this file is for.
#
# Same `checksum` discipline as every row: taken from Cargo.lock, whose own sha256
# moved in this lane (`[build].cargo_lock_sha256`, one added line).
[[crate]]
name = "futures-macro"
version = "0.3.32"
checksum = "e835b70203e41293343137df5c0664546da5745f82ec9b84d40be8336958447b"

