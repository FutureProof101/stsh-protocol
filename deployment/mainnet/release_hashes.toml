# ── [wallet_bundle_release] — the M-02 (B-ii) release-state marker ────────────
#
# ADDED BY HARDEN-02 (2026-09-17). This table says whether a wallet bundle is
# being RELEASED at this head, and therefore whether the BYTE measurement of
# `wallet/dist` is owed here. It is read by
# `verify_custody_manifest --wallet-bundle-bytes`, and its presence and value are
# checked by the record-coverage half on every gate run — so "the measurement did
# not run" is a state this file DECLARES, never an inference from an absent file.
#
# WHY A MARKER AT ALL. The byte check stands between two failure modes that are
# both worse than a declaration:
#
#   * SKIP WHEN IT CANNOT RUN. `wallet/dist` is gitignored (`.gitignore:12`), so
#     absent is the NORMAL state on a fresh clone, and the gate deliberately skips
#     the whole wallet leg on a host without node/npm/wasm-pack. A check that
#     skips on absence restores exactly the gap it was added to close, and this
#     record's own history is the argument: two real defects in the tables above
#     sat green across several lanes because the only checker that would have seen
#     them was opt-in and never invoked.
#
#   * FAIL WHENEVER IT CANNOT RUN. That turns every routine gate run on every
#     host without the pinned wallet toolchain red, which trains readers to work
#     around the check.
#
# So the record states which it is. Under `state = "releasing"` the byte check
# asserts the pinned toolchain tuple BEFORE measuring and REFUSES on a mismatch
# (a digest measured under a different tuple is a different number, not weaker
# evidence about the pinned one), and an absent or non-matching `dist` fails
# closed. Under `state = "held"` it reports, in its own output, that the
# measurement is DECLARED not owed and names this reason. An absent table, an
# absent `state`, an unrecognised `state`, or an absent `reason` is a
# `WalletBundleUnbound` violation — and that kind is NOT in `DECLARABLE_KINDS`, so
# it cannot be declared pending in `[deploy_gate].expected_pending` either.
#
# FLIPPING THIS TO "releasing" IS A RELEASE ACTION, not a lane convenience. The
# host must be running the pinned tuple and `dist` must be the bundle actually
# being installed. If the resulting digest differs from `[wallet_bundle].sha256`,
# that is a Phase-D.8-affecting event and goes back to the CTO and the Owner
# BEFORE any packet closes — never a silent hand rebind inside another lane.
#
# ── HARDEN-03 (2026-09-17) — THE MARKER GAINS `variant` ──────────────────────
#
# ADDITIVE, and this table is UNCHANGED at this head. A third key now exists:
#
#   variant = "final" | "transitional"
#
# REQUIRED when `state = "releasing"`, and FORBIDDEN when `state = "held"` —
# which is why nothing below needs editing: this head is terminally `held`, so a
# `variant` here would itself be a violation. The key is added when a release
# lane flips the marker, and removed when it flips back.
#
# WHY IT WAS NEEDED. `check_wallet_bundle_bytes` read `doc.get("wallet_bundle")`
# unconditionally, and BOTH tables record `path = "wallet/dist"`. There was
# therefore NO STATE in which a Phase B.1 lane could have its transitional `dist`
# measured: flipping this marker compared the transitional tree against the FINAL
# digest and failed. That is the gap clause (3) of the `reason` below discloses,
# and it is now closed — see the HARDEN-03 paragraph at the end of `reason`.
#
# `final` selects `[wallet_bundle]` and `transitional` selects
# `[wallet_bundle_transitional]`; an absent or unrecognised value is REFUSED, not
# defaulted, for the same reason an unrecognised `state` is — defaulting to
# `final` restores exactly the mis-comparison above. The violation kind is
# unchanged (`WalletBundleUnbound`), so nothing here became declarable in
# `[deploy_gate].expected_pending`.
#
# THE GATE STILL BUILDS THE FINAL VARIANT ONLY. `run_gate.sh`'s wallet phase runs
# `npm run build`, and the wallet vitest leg reads the built
# `dist/wallet-config.json` and asserts the FINAL variant's `derivationOrigin` —
# so the gate must NOT be taught to build the transitional bundle; it would red
# its own leg. A transitional qualification pass is an OUT-OF-GATE step:
# `rm -rf wallet/dist && npm run --prefix wallet build:transitional`, then
# `verify_custody_manifest --wallet-bundle-bytes .` with `state = "releasing"`
# and `variant = "transitional"`, and the marker returned to `held` before the
# lane's one law-7(e) gate. `releasing` is never committed except by the lane
# that is actually installing.

