# =============================================================================
# STSH — GENESIS PRINCIPAL RECORD
# Remediation lane R-3 (H-3, HOLD-LAUNCH).
# BRIEF_R3_GENESIS_PRINCIPAL_BINDING_V7_2026-09-04.md
# =============================================================================
#
# THE INDEPENDENT SECOND SOURCE for genesis principal IDENTITY.
#
# Every other control over these principals is a COHERENCE check: the artifact
# is compared to the manifest (D10/D11/D13/D14/D15/V1/V2), the manifest to the
# hardcoded approved schema (DP0/DP1), and every site to the placeholder
# predicate (DP3). All of that catches an INCONSISTENT RR-1 and is structurally
# incapable of catching a CONSISTENT one: a substituted, typo'd or
# attacker-chosen principal written identically into genesis_manifest.toml,
# stsh_token_init.did and vesting_init.did passed the entire gate GREEN.
#
# This file is the source of truth those three inputs are checked AGAINST. It is
# consumed by `scripts/verify_genesis_manifest` and by NOTHING ELSE — no deploy
# path, no install path, no canister reads it. That separation is the whole
# mechanism: the file that SETS the principals cannot also CERTIFY them.
#
# Its exact committed bytes are pinned by `GENESIS_PRINCIPAL_RECORD_SHA256` in
# `scripts/verify_genesis_manifest/src/lib.rs` (check `GP6-record-pin`). Every
# edit here is therefore PAIRED with a reviewed source edit, on purpose. When
# you change this file, regenerate that constant LAST, after every other edit:
#
#   sha256sum deployment/mainnet/genesis_principals.toml
#
# Line endings are LF (.gitattributes: `*.toml text eol=lf`, core.autocrlf
# false). The pin is over exact bytes; a CRLF checkout would move it.
#
# WHAT THIS DOES NOT PROVE (the honest residual, brief §3.3/§6.2): a coherent
# FIVE-artifact edit — the three genesis inputs, this record, and the source pin
# — that retains a pinned attestation digest is NOT detected here. `provenance`
# is a POINTER to a reviewed attestation, not a proof of provenance. That
# residual sits behind review capture, the same bar the Vault quorum sits
# behind, and is asserted as an executable GREEN fact by
# `ac4c_five_artifact_coherent_edit_is_not_detected`.
#
# ── Entry grammar ────────────────────────────────────────────────────────────
#   principal  = "<principal>"  a resolved, literal value
#   principal  = "PENDING"      unresolved: the role's production principal is
#                               not yet ruled. FAIL-CLOSED, never a wildcard —
#                               a PENDING role fires GP1-pending-<ROLE>, and
#                               fires GP1-pending-input-populated-<ROLE> too if
#                               any of its install-input sites has already been
#                               populated with a non-placeholder value.
#   binding    = "vault_authorities"
#                               CROSS-BOUND: the value is READ from
#                               deployment/mainnet/vault_authorities.toml's
#                               `vault` key, never copied here. A role carries
#                               `principal` OR `binding`, never both.
#   provenance = "<sha256>"     names an accepted attestation digest
#                               (GENESIS_ATTESTATION_DIGESTS in the verifier).
#
# CENSUS — REGENERATED FROM THIS FILE BY LANE A-2, 2026-09-09. Never inherited
# from a previous revision; recount by parsing (`grep -c '^\[role\.'`) whenever
# this file changes.
#
# 17 entries: 15 base roles — the 11 allocation `principal_role`s of the V4 D-0
# table, plus STAKING_CANISTER, NEUTRAL_FEE_COLLECTOR, STSH_TOKEN_CANISTER and
# VESTING_CONTROLLER_MULTISIG — and 2 schedule beneficiaries
# (FOUNDER_1_BENEFICIARY, LEGAL_COUNSEL_BENEFICIARY). At land time 16 are
# PENDING; the 17th, STAKING_CANISTER, is cross-bound and resolved from day one.
#
# Delta from the pre-A-2 record (19 entries): retired DEV_HOLDING_MULTISIG,
# ZK_HOLDING_MULTISIG, INCENTIVES_EMISSION, FOUNDER_2_BENEFICIARY,
# FOUNDER_3_BENEFICIARY; added STRATEGIC_GRANTS_MULTISIG,
# CAPITAL_RESERVE_MULTISIG, EXTERNAL_LP_INCENTIVES.
#
# NOTE (D-5 / OPEN-1, ruled B-1): the day-one 3% Protocol-Owned Liquidity deploy
# target is NOT a separate role entry. Bucket 9 mints to LIQUIDITY_MULTISIG and
# the deploy happens afterwards from that account; the AMM/operator target
# resolves at J-18/A8. Adding an entry here would fire GP1-role-extra.
# =============================================================================

schema_version = 1      # THIS RECORD's own schema. NOT the genesis manifest's
                        # schema_version (3) — the two are independent and
                        # AC-11 asserts they are never conflated.
rr1_performed  = true   # DECLARED POSTURE, enforced by run_gate.sh's genesis
                        # posture stage (brief §6.1). This is not a licence:
                        # flipping it to `true` makes the stage STRICTER — the
                        # observed failing set must then be EXACTLY EMPTY.

