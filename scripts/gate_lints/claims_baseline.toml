#
# The full-corpus hit list, annotated honestly, one row per hit.
#
# LANE R-11 (2026-09-07) DISCHARGED EVERY UNBACKED ROW; LANE R-L2 (2026-09-08)
# then grew the corpus and reintroduced them. The counts are NOT
# restated in this header — a hand-maintained tally above a list is the exact
# second-source-of-truth shape this lane spent its time removing. Regenerate
# them at the point of use:
#
#   grep -c '^\[\[claim\]\]' scripts/gate_lints/claims_baseline.toml
#   grep '^marker' scripts/gate_lints/claims_baseline.toml | sort | uniq -c
#
# WHAT A ROW MEANS.
#   MEASURED — the claim is stated inside a `#[test]` function, and THAT TEST is
#              what backs it.  The lint checks the referent NAMES A REAL fn; it
#              does NOT and CANNOT check that the test exercises the specific
#              attached claim.  That check is a human read, and a `MEASURED:`
#              pointing at a real test that does not exercise its claim is WORSE
#              than no marker at all.  R-11 found exactly one such row live in
#              this file (the vault `pic_tests.rs` history-depth clause, pointed
#              at an unrelated upgrade test) and re-pointed it; the general
#              relevance gap is a register item owned by lane R-L2.
#   UNBACKED — no measurement exists.  The reason says what is actually missing.
#              R-11 left ZERO of these; lane R-L2 (2026-09-08) grew the corpus by
#              twelve patterns and REINTRODUCED them, so "there are none left" is
#              no longer true of this file.  See the R-L2 section below, whose
#              header states that every row it adds is `UNBACKED`.  The posture
#              as of that lane, PASTED from the two commands above and not
#              retyped:
#
#                $ grep -c '^\[\[claim\]\]' scripts/gate_lints/claims_baseline.toml
#                57
#                $ grep '^marker' scripts/gate_lints/claims_baseline.toml | sort | uniq -c
#                     15 marker   = "MEASURED"
#                     42 marker   = "UNBACKED"
#
#              That block is a dated SNAPSHOT, not a tally to maintain — rerun
#              the commands rather than trusting it.  A row REINTRODUCED with
#              this marker needs a reason that says what is missing and which
#              lane owns it — never a softened restatement of the claim.
#
# HOW R-11 DISCHARGED A ROW — four remedies, all applied at the SOURCE, never by
# adding a marker to an unmeasured claim:
#   MEASURE       — a real test now exercises the claim; the row carries its name.
#   REWORD        — the sentence overstated what was true; the corrected sentence
#                   no longer asserts a cost bound, so it is not a hit and has no
#                   row.
#   DELETE        — the claim quoted figures nothing in the tree produces, for a
#                   canister not installed at launch; the figures are gone.
#   STALE-DELETE  — the sentence was true as history and false as present tense,
#                   with a HISTORICAL banner already covering it; removed.
#
# The baseline discharges the marker obligation for these EXACT claim texts and
# nothing else.  Rows are keyed on (file, whitespace-normalised text), NEVER on
# a line number — a line number moves the moment anything above it is edited,
# which would silently transfer an old row's annotation onto a new claim.  Edit
# a claim's wording and its row stops matching, which is a finding (a stale
# annotation is an annotation nobody is watching), not a silent pass.
#
# Fixing a claim listed here is the OWNING lane's job. This file labels.

