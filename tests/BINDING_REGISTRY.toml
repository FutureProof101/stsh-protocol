# ── B-R3A-STRING-API-PRIVATE — no public record-blind genesis surface ────────
#
# `run_gates_from_strs` runs gate_d and gate_v_pre_install and nothing else —
# no genesis-principal record, no GP0..GP6. While it was `pub`, an out-of-crate
# caller could get a green Vec<CheckResult> from it and report "the genesis
# gates pass" from a run that never read the record the roles are bound to.
# 49 call sites were on it.
#
# The bound test parses lib.rs's own source with `syn` (dev-dependency, `full`
# feature only) rather than grepping it — a text lock is defeated by a reformat
# or a `pub(crate)`. `fn_visibility` returns `bool`, so `syn::Visibility` never
# needs `PartialEq`/`Debug` and no `extra-traits`/`printing`/`quote` is pulled
# in. Invoked on "run_gates_from_strs" (expect true/Inherited) and
# "run_gates_on_dir" (expect false/Public), each asserted individually, then
# `assert_ne!` on the two bools.
#
# MUTATION RECIPE: restore `pub fn run_gates_from_strs`. Observed RED:
# "`run_gates_from_strs` must NOT be `pub`: it runs gate_d and
# gate_v_pre_install only …".
[[binding]]
id         = "B-R3A-STRING-API-PRIVATE"
property   = "fn_visibility"
status     = "closed"
bound      = "r3a_run_gates_from_strs_is_not_pub"
test_crate = "verify-genesis-manifest"
