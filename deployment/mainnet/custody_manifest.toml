# =============================================================================
# STSH — CANONICAL CUSTODY MANIFEST (freeze V6 §13, H3)
# =============================================================================
#
# THE single canonical custody inventory. DERIVED, NEVER AUTHORED: every entry
# exists because at least one candidate-producing derivation (D1–D5) produced
# it, and carries exactly ONE Axis-1 IC-controller disposition
# (freeze §13.2a/§13.4).
#
# `deployment/mainnet/genesis_manifest.toml` is NOT a deployment inventory —
# it is token allocation and init-wiring only and must never be cited as the
# canister set (freeze §13.2).
#
# Deploy-time gates, separate (freeze §13.5) — plus, per SSA integration
# INT-02: the independent vault deployment init artifact
# `deployment/mainnet/vault_init.did` must exist and verify against the
# Vault's REQUIRED_CUTOVER constants and this manifest's
# set_controller_at_cutover rows BEFORE any deployment. That check is
# deploy-time class only: `verify_custody_manifest --deploy-time` fails with
# the typed PendingDeploymentArtifact until L4/runbook produces the artifact;
# the build-time gate stays green without it. The build-time cutover check
# proves source↔manifest equality + fixture consistency only — it does NOT
# prove the real deployment payload; only this artifact check does.
#
# Build-time gate: scripts/verify_custody_manifest (a blocking phase in
# run_gate.sh, AFTER the MemoryId lint but NOT immediately after it — a
# citation-inventory lint runs between the two, and "immediately" made the
# ordering sound like a contract it never was; corrected by lane R-11) enforces
# freeze §13.2a:
#   - every candidate in D1∪D2∪D3∪D4∪D5 appears EXACTLY ONCE here with a
#     disposition;
#   - conflicting facts about the same principal FAIL — but only within the
#     same semantic field (observed_current vs expected) and the same gate
#     epoch; stale/mixed-epoch evidence fails as typed StaleEvidence (distinct
#     from FactConflict, NEVER a pass);
#   - absence from a source fails ONLY where that source is declared complete
#     for its universe;
#   - D5 receipts must be bijective with Vault-created production entries.
#
# Gate epoch for all fact comparison in this file: "custody-l0-2026-08-03".
#
# D6 is NOT a candidate source (freeze §13.2b, round-4 R4-1): its pinned
# command `dfx canister list` does not exist in dfx 0.28.0. It survives only
# as a post-union attribution cross-check and contributes no candidates here.

schema_version = 2
gate_epoch = "custody-l0-2026-08-03"

# ── §P.1 — the 2+9 custody partition ─────────────────────────────────────────
#
# schema_version 2 splits the eleven custody targets into two halves with
# DIFFERENT evidence contracts:
#
#   BootstrapRing (2)   vault, upgrader — born at bootstrap. The Vault did not
#                       create them, so no D5 receipt for either can be
#                       genuine. Evidence is a ceremony artifact.
#   BornUnderVault (9)  the exact BORN_UNDER_VAULT_ROLES allowlist
#                       (canisters/vault/src/lib.rs). Created by the Vault,
#                       each evidenced by exactly one `bound` D5 receipt.
#
# Under schema_version 1 both halves carried `born_under_vault`, which asserted
# Vault provenance for the ring pair. D5 bijectivity ("every born-under-vault
# entry has a receipt") was then unsatisfiable in principle and could only pass
# vacuously — the shape that reports success while proving nothing.
#
# WHERE RING EVIDENCE LIVES — RULED: a SEPARATELY HASHED CEREMONY INPUT, not a
# field of this file. This manifest is derived, never authored: every entry
# exists because a derivation produced it. The ring pair is the one pair no
# derivation can produce. Pasting its ceremony observations here would author
# the single class of fact this file exists to reject. So the manifest carries
# only the fail-closed pointer below; the observations live in their own
# artifact with their own hash.
#
# FAIL-CLOSED: while `status = "pending"` no ring entry may carry a principal
# (an unevidenced principal is an authored fact), and any D5 receipt naming a
# ring role fails as RingReceiptPresentedAsVaultCreated. When
# `status = "populated"` the artifact must exist and hash to evidence_sha256 —
# missing, unreadable, unpinned or mismatched all FAIL; none is an empty pass.

# ── DEPLOY POSTURE (R-3b S1) ─────────────────────────────────────────────────
#
# Before R-3b, `./run_gate.sh` stayed green over the deploy-time checks by not
# running them at all: `--deploy-time` was never passed, so authority binding,
# recovery roster, release identity and launch evidence executed on NO gate run
# and a regression in any of them would have gone unnoticed.
#
# It stays green now by DECLARING what is pending instead. `run_gate.sh` runs
# `verify_custody_manifest --deploy-posture`, which executes the full
# deploy-time set and compares the OBSERVED keys to `expected_pending` for
# EXACT SET EQUALITY. Each key is `Violation::key()` — built from TYPED fields
# on the violation, never from its message text — so swapping WHICH obligation
# is pending (same kind, same count) is a set difference and fails, and a
# reworded message can never silently change an obligation's identity.
#
# Only four violation kinds may EVER be declared here (AuthorityFieldIncomplete,
# PendingDeploymentArtifact, ReleaseIdentityNotAsserted, LaunchEvidenceIncomplete);
# any other kind-prefix is refused at LOAD, exit 2, before a check runs.
#
# `posture = "launch"` is a reviewed ONE-LINE change. It requires
# `expected_pending = []` (refused at load otherwise) and then demands a
# completely clean deploy verdict — no allowlist survives the flip.

[deploy_gate]
posture = "pre-ceremony"
expected_pending = [
  # Ceremony not yet performed: D5 carries zero creation receipts for the
  # born-under-Vault targets.
  "LaunchEvidenceIncomplete:d5-receipts",
  # Lane A-3 FINALIZE (2026-09-12) bound `ids_name = "shielded_pool"` to the
  # born_under_vault entry, which the D2 binding check forces to carry
  # `principal = "cxrfg-qaaaa-aaaar-qchfa-cai"`. The pool principal is therefore
  # NAMED here while [sources.d5] is still `pending` with `receipts = []`, so
  # check_launch_evidence observes it as an unreceipted Vault-created target.
  # CAUSE: the pool principal is bound before the J-18 creation receipts are
  # recorded. REMOVED BY: the finalize-assemble lane that records the D5
  # receipts (RULING_RECORD_RING_CLOSURE_TIMING_2026-09-12). No receipt is
  # authored in A-3.
  "LaunchEvidenceIncomplete:unreceipted:cxrfg-qaaaa-aaaar-qchfa-cai",
]

[bootstrap_ring]
status = "pending"
evidence_path = "deployment/mainnet/bootstrap_ring_evidence.toml"
evidence_sha256 = ""
members = ["vault", "upgrader"]

