# The staking canister is NOT installed at launch — it has no manifest entry
# here and no mainnet principal. This field is NOT an install declaration: it is
# the token's required, fail-closed stored staking principal, and at RR-1 it is
# replaced with the VAULT principal, never with a staking-canister principal
# (freeze §14; see deployment/mainnet/custody_manifest.toml, stsh_token
# STAKING_CANISTER authority_field and the `staking` out_of_scope entry).
# Introducing staking is a post-launch governance upgrade (freeze §15).
staking_canister = "cpdab-saaaa-aaaar-qca2q-cai"   # the VAULT principal, pinned at RR-1a (freeze §14)
fee_collector    = "jdc4c-utkoi-nekq7-h7fod-ewtgg-jqeak-tde3m-t7v7j-m5hq3-lnaoz-yae"   # NEUTRAL_FEE_COLLECTOR (RR-1a)

[vesting_init]
