# then ef1c121). `wallet/vite.config.ts` / `wallet/src/release/emitPins.ts`
# generate `wallet/src/generated/releasePins.json` from the `[wasm.*]` pins;
# `wallet/src/ui/pages/operator.ts:70` imports it and `wallet/src/ui/app.ts:98`
# pulls it into the bundle graph. A Wasm re-pin is therefore a WALLET BUNDLE
# INPUT change, which no checker catches: the gate's own Phase 2c wallet build
# rewrites `releasePins.json` before the vitest leg reads it, so a stale
# committed copy is structurally invisible. `git diff --name-only
# e0c1f4db..b0244c8 -- wallet/` is seven files, and exactly one of them reaches
# an emitted byte of the FINAL bundle: `releasePins.json`. (`package.json` gained
# the `build:transitional` script; `vite.config.ts` is a build driver;
# `public/wallet-config.transitional.json` is the variant INPUT and is removed
# from `dist` in both variants; `BUILD_PLAN.md` is docs; two `tests/*.test.ts`
# are not bundled. That this set does not move the final bundle is the same fact
# WT-1b established when it re-measured this row to `6af7b2cc…` byte-identically.)
# `releasePins.json`'s `stsh_token` value moved a90318da… -> 960dae96… — sixty-
# four hex characters for sixty-four — which is why `sha256` moves and `bytes`
# does NOT.
