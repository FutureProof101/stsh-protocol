# ── 6. stsh_token — GENESIS (RR-1b) ──────────────────────────────────────────
#
# THE LEDGER, and the first of the two GENESIS installs. It must precede
# `vesting`: the vesting init argument NAMES the token canister, and the
# founders/counsel allocation is minted to the vesting canister's account by
# THIS install. Installing vesting first would leave a canister pointing at an
# uninstalled ledger and a read-back with nothing to read.
#
# Its argument is deployment/mainnet/stsh_token_init.did — the Gate-D-verified
# canonical genesis artifact, the same file `verify_genesis_manifest` checks
# field-by-field against genesis_manifest.toml. It is NOT rewritten for this
# kit; the kit adds the encode, the hashes and the operator wiring around it.
# Every principal in it is a RESOLVED role in genesis_principals.toml (RR-1a for
# ten of them, RR-1b for none — the counsel beneficiary is a vesting SCHEDULE
# site, not a token allocation recipient).
