#
# LAUNCH pin — the mainnet-v2 ceremony output. This is no longer a dev pin.
# A-4 LANDING (2026-09-12) performed exactly the one-step flip this header
# described: `sha256`, `label` ("DEV" -> "PRODUCTION") and `record_transcript`
# moved together with deployment/mainnet/genesis_manifest.toml's
# [pool_init].vk_hash, in ONE commit.
#
# This file is read by exactly TWO consumers:
#   (1) verify_genesis_manifest's own DPOOL-9 / DPOOL-9b / DPOOL-8b checks,
#       natively, at gate run-time, resolved at
#       <repo_root>/scripts/verify_genesis_manifest/VK_PIN.toml — the SAME
#       repo_root run_gates_on_dir already threads through every DPOOL check.
#       A test that builds a temp repo_root MUST ship its own fixture copy of
#       this file under that temp tree, or the checks fail closed on
#       "record_transcript_unreadable" instead of on a byte mismatch.
#   (2) stsh-verifier's `cargo test` suite (compiled_vk_hash_matches_committed_pin),
#       via a compile-time include_str!, never at runtime and never from
#       canister code.
#
# `record_transcript` is the sha256 of docs/ceremony/CEREMONY_RECORD_v3.md's
# CURRENT, UNEDITED byte content.
#
# A-4 LANDING (2026-09-12): the record was filled in full in this lane, so
# `record_transcript` is re-hashed here in the SAME commit -- DPOOL-8b is
# always-on and would otherwise be red on the intermediate head. Sequencing is
# BINDING (brief V2 4.4): the record's LAST byte is written first, THEN it is
# hashed, THEN that hash lands here. Hashing a record you are still editing is
# the circular dependency this order exists to break. The record is never edited
# after its hash is pinned -- any later touch, including whitespace, re-opens
# the whole sequence.
#
# `label` is now "PRODUCTION": DPOOL-9b is posture-gated on DPOOL-1b, and
# genesis_manifest [pool_init].vk_hash was ARMED with the launch VK in this same
# commit, so the placeholder posture no longer applies. Because that gating is
# one-directional, a stale "DEV" here would fail LATE rather than early -- it is
# called out for that reason.
#
# THIRD MIRROR, easy to miss: the record's sha256 is ALSO hand-transcribed into
# scripts/verify_genesis_manifest/tests/ceremony_transcript_tests.rs:24
# (RECORD_TRANSCRIPT_LITERAL). That fixture pins the literal and feeds it the
# LIVE record's bytes, so editing the record without updating BOTH files fails
# the workspace leg. `grep -rIn <old record sha>` returns exactly these two
# files -- derive the set, do not transcribe it.

