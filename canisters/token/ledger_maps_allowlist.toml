# ledger_maps_allowlist.toml — R-1 S4(b).
#
# Every permitted NON-PRIVATE item inside `mod ledger_maps`
# (canisters/token/src/lib.rs), with the cfg under which it is allowed.
#
#   cfg = "always"   the item must be present in EVERY build and must NOT carry a
#                    `#[cfg(feature = "testing")]` attribute.
#   cfg = "testing"  the item MUST carry that attribute, and is therefore absent
#                    from every build without the feature.
#
# "Non-private" means ANY visibility broader than default-private — `pub`,
# `pub(crate)` and `pub(super)` alike, deliberately: a `pub(crate)` helper is
# still reachable from every other function in `lib.rs`, which is exactly the
# reachability S4(b) removes.
#
# BALANCES / STAKING_LOCKS / SUM_BALANCES / SUM_STAKING_LOCKS are deliberately
# ABSENT: they are private to the module, and widening any of them is a lint RED.
#
# `UpgradeWitness` / `GenesisWitness` are deliberately ABSENT too, and no TYPE
# may ever appear here (RED-1 round 2, SSA_LANDED_DIFF_R-1_V2_2026-09-05.md /
# `cto-triage-ssa-landed-diff-round2-2026-09-05`): a nameable type can carry an
# inherent `impl` written ANYWHERE in the crate — including inside a function
# body, which no item walk reaches. The module exposes FREE FUNCTIONS only. The
# lint refuses any non-private type declared in the module, so adding a row for
# one here cannot make it pass.
#
# Reviewed data. Never auto-derived, never regenerated by the gate.

[[item]]
name = "get_balance"
cfg = "always"

