[package]
name    = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Integration tests are NOT compiled to Wasm — they run on the host target
# and drive canister Wasm files via the PocketIC server.
#
# PREREQUISITE: build canister Wasm first, then set POCKET_IC_BIN:
#
#   cargo build --target wasm32-unknown-unknown --release \
#       -p stsh_token -p staking -p shielded_pool -p nullifier_registry
#
#   export POCKET_IC_BIN=$(dfx cache show)/pocket-ic
#
#   cargo test -p integration-tests

