# ── Axis 2 — authority-principal inventory (freeze §13.4, §6 builder sweep) ──
# Scope is AUTHORITY: principals used for authorization, privileged routing,
# peer-call trust, controller/configuration, or custody — not every serialized
# Principal. 18 durable authority fields at commit 6520185. Launch values that
# name a born-under-vault principal are PENDING until that principal is
# allocated at bootstrap; any change to a stored authority value post-launch
# goes through the same proposal and evidence path as any other action
# (freeze §13.4 — a launch read-back is not perpetual proof).

[[authority_field]]
canister = "shielded_pool"
field = "TOKEN"
storage = "shielded-pool/src/lib.rs:2608-2613 (authority refs)"
writers = ["init"]
launch_value = "PENDING(stsh_token born-under-vault principal)"
read_back = "get_authority_refs (L3c)"

