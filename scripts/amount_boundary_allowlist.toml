# ── Opaque types: declared, not skipped ──────────────────────────────────────
# The traversal terminates on primitives and follows every in-tree type. A type
# with no in-tree definition would otherwise be a silent hole, so it must be
# declared here with the reason it cannot carry a raw u128/i128. An undeclared
# unfollowable type is a hard gate failure, not an omission.
#
# Opacity is CRATE-SCOPED: `krate` + `name` must both match the namespace in force
# where the type is met. A bare name would be a global stop — declaring a foreign
# type opaque for one crate would silence an identically named type everywhere,
# which is a scope no reviewer authorised.

[[opaque]]
krate  = "canisters/smoke-alarm-monitor"
name   = "ByteBuf"
reason = "serde_bytes::ByteBuf, a foreign newtype whose only field is bytes: Vec<u8>, with no in-tree definition. It is a byte sequence, not a record: its element type is u8, already TERMINAL to this checker, so no u128/i128 field can be reachable as an amount boundary through it. Reached only at CertifiedSolvencySnapshot.canonical_bytes / .certificate / .witness — the certified leaf bytes, the subnet certificate, and the CBOR witness. Declared opaque, not skipped: traversal stops here BECAUSE the type cannot carry a boundary, not because following it was inconvenient. The krate key is the scope, not a comment: an identically named type in any other crate stays BOUNDARY-UNRESOLVED. R2-1 return-side census, CTO adjudication 2026-08-23; A1 authored, SSA-1 reviewed."

[[opaque]]
krate  = "canisters/shielded-pool"
name   = "ByteBuf"
reason = "serde_bytes::ByteBuf, a foreign newtype whose only field is bytes: Vec<u8>, with no in-tree definition. It is a byte sequence, not a record: its element type is u8, already TERMINAL to this checker, so no u128/i128 field can be reachable as an amount boundary through it. Reached only at CertifiedSolvencyAttestation.canonical_bytes / .certificate / .witness — the certified attestation leaf bytes, the subnet certificate, and the CBOR witness. Declared opaque, not skipped: traversal stops here BECAUSE the type cannot carry a boundary, not because following it was inconvenient — and the amount this attestation publishes is NOT hidden behind it: public_delta_e8s is a Candid-visible field enrolled in its own [[amount]] row (bytes-only encodings rejected, CTO disposition 04c3892f…). The krate key is the scope, not a comment: an identically named type in any other crate stays BOUNDARY-UNRESOLVED. Smoke-alarm completion lane, CTO adjudication 2026-08-26 under D-2+D-4 (aabbf239…); SSA-reviewed."

