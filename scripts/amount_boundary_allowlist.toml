# ── The adjudicated boundaries — CTO ruling V2 (8945c2ad…), A1-concurred ──
# Four classes, each row carrying the gate that makes it safe. Gates are
# identified as `crate::function`, never line numbers: `canisters/` moves under
# this allowlist every campaign, and a line number rots into a citation that
# points at unrelated code (A1 C2).
#
# The per-class counts below are the ONLY place a count is stated, and they are
# kept current by `umc12_allowlist_header_class_counts_match_actual_rows`
# (`scripts/verify_did_exports/tests/amount_boundary_class_counts_tests.rs`),
# which re-counts the rows and fails if the header drifts. Do not restate a
# total anywhere else in this file: the header used to carry a hand-maintained
# file-level total and a Class C count, and BOTH had drifted away from the rows
# by the time anyone recounted them (lane R-11).
#
#   Class A — inter-canister, caller-asserted            (6 rows)
#   Class B — controller/operator-gated setters          (10 rows)
#   Class C — user-facing, proof/denomination/conservation-bound (4 rows)
#   Class D — vault admission mirrors; the authoritative gate is the executing
#             canister's own, which the vault reaches as its operator (11 rows)

