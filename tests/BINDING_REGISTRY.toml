# private_spend resubmission under an existing spend_id is the SAME logical
# operation. Two of its comparisons — payout destination and destination
# subaccount — were unbound: deleting either left the whole existing suite green,
# because `test_prec_spend_intent_fingerprint` hardcodes both fields in its
# fixture and is structurally blind to the deletion.
#
# The bound tests seed a live (VerificationPending) record owned by the caller,
# then retry twice through the REAL private_spend entrypoint: once identically
# (DuplicateSpendId, the in-flight catch-all — NOT "accepted as idempotent") and
# once with a diverging destination / subaccount (IdempotencyKeyConflict). Under
# the mutation both collapse into the same arm, so the assert_ne! REDs.
#
# The existing B-3 row is a DIFFERENT property (`encode_recipient_signals`,
# recipient ENCODING) — these rows do not repoint it.
[[binding]]
id         = "B-3-INTENT-DESTINATION"
property   = "spend_intent_matches"
status     = "closed"
bound      = "b3_intent_destination_divergence_retry_rejected"
test_crate = "integration-tests"
