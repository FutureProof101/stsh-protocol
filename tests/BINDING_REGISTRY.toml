# ── B-6-STAGE-BEFORE-FINALIZE — ARCHITECTURE.md law 3, from code ───────────────────
#
# Output commitments stay STAGED until the parent nullifier reservation reaches
# finality via insert_batch; the Merkle append happens only afterwards. Until
# this row the order was asserted only in prose — and one of those comments
# (lib.rs, the SpendStatus state-machine block) still described the CLOSED
# QA-DEF-034 outputs-first order.
#
# The bound test drives two real deposit-backed spends through
# `force_nullifier_insert_unknown_for_test`: mode 2 (insert_batch skipped, so
# finality is unresolved) must leave the Merkle leaf count UNCHANGED, and mode 0
# (real call, finalizes) must move it. MUTATION RECIPE (packet R-9 D-1): a bare
# relocation of the append ahead of the insert_batch await is INERT (the status
# guard early-returns WrongSpendStatus); the RED mutation is relocation PLUS
# advancing the status to NullifierFinalizedOutputsPending -> equality arm RED
# (leaves 3 vs 1).
[[binding]]
id         = "B-6-STAGE-BEFORE-FINALIZE"
property   = "spend_under_finality_mode"
status     = "closed"
bound      = "test_merkle_append_only_after_nullifier_finality"
test_crate = "integration-tests"
test_file  = "integration-tests/tests/r9_pool_intent_binding_tests.rs"

# ── B-7-ACCOUNTING-WRITETHROUGH-SPEND — R-13, from code ──────────────────────
#
# `apply_private_spend_accounting` used to debit PRIVATE_LIABILITY and
# ESCROW_BACKING with raw heap `borrow_mut` blocks and then return early on
# `fee == 0` — the launch config — so `commit_pool_accounting` never ran and the
# stable cell never saw the debit. The figures were correct only "by accident"
# on the fee>0 path, where an unrelated reserve credit happened to commit all six
# words afterwards.
#
# The bound test performs two real deposit-backed, zero-fee `private_spend`s
# carrying nonzero public payouts (distinct denominations, hence distinct
# debits), reads the six accounting words, upgrades the pool canister for real,
# and reads them again. MUTATION RECIPE (packet R-13 AC-2): revert
# `apply_private_spend_accounting`'s body to the base shape — raw
# PRIVATE_LIABILITY/ESCROW_BACKING `.with(|..| borrow_mut)` blocks as top-level
# statements followed by `if fee == 0 { return None; }` — as a PATCH of the fn
# body, not a `git checkout` of the file (that would revert R-9's tests too).
# Observed RED: before [50000000, 50000000, 0, 0, 0, 0] vs after
# [100000000, 100000000, 0, 0, 0, 0] — words 0 and 1 differ by the payout.
# The attestation `healthy` assertions in the same test are a disclosed SANITY
# check, NOT an independent RED source: the debit is symmetric on escrow and
# liability, so raw_solvency_delta is algebraically invariant and neither
# published field can move in any build, correct or mutated.
[[binding]]
id         = "B-7-ACCOUNTING-WRITETHROUGH-SPEND"
property   = "spend_with_payout_and_read_across_upgrade"
status     = "closed"
bound      = "b7_accounting_writethrough_spend_survives_upgrade"
test_crate = "integration-tests"
test_file  = "integration-tests/tests/r13_pool_accounting_writethrough_tests.rs"

# ── B-7-ACCOUNTING-WRITETHROUGH-WITHDRAW — R-13, from code ───────────────────
#
# `apply_withdrawal_accounting` credited GOVERNANCE_REWARDS_RESERVE with a raw
# heap `+=`, outside the funnel, on EVERY fee value — and it ran AFTER the two
# `acct_add` calls had already committed, so the cell carried the pre-credit GRR
# while the heap carried the post-credit one. The defect is LATENT rather than
# live at launch only because `validate_staking_posture` refuses `enabled`
# unconditionally (G-FEESPLIT), forcing the staking split to 0.
#
# The bound test writes a SYNTHETIC GovernanceFeeParams straight into the
# thread-local (sound: `split_protocol_fee_to_reserves` itself calls only
# `validate_split_bps`) to engineer a nonzero staking credit, and asserts the
# cell word equals the heap word immediately after the call. Two invocations,
# 0 bps and 2000 bps. MUTATION RECIPE (packet R-13 AC-3): restore the raw
# `GOVERNANCE_REWARDS_RESERVE.with(|r| *r.borrow_mut() += staking);` after the
# `acct_update` closure and drop the GRR `checked_add` from inside it. Observed
# RED: heap 10000 vs cell 0.
[[binding]]
id         = "B-7-ACCOUNTING-WRITETHROUGH-WITHDRAW"
property   = "apply_withdrawal_and_read_cell"
status     = "closed"
bound      = "b7_accounting_writethrough_withdraw_cell_matches_heap"
test_crate = "shielded_pool"
test_file  = "canisters/shielded-pool/src/lib.rs"

