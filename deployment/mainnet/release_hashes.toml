iles, 14,103,435 bytes, `cd wallet && npm run build:transitional`); `[wallet_bundle]` = 74dd2180b9d9abc2ed71449cde1eb86158d16ee9c61a78487b9fcf741c1d9ceb (11 files, 14,103,504 bytes, `cd wallet && npm run build`). The 69-byte delta is the `derivationOrigin` member of `wallet-config.json`, the ONLY file that differs between the two `dist` trees — the key is ABSENT in the transitional copy and is `\"derivationOrigin\": \"https://s3tyu-aaaaa-aaaab-qhdjq-cai.icp0.io\"` in the final one, checked in the built output of both. BOTH rows therefore now describe artifacts built from this head's wallet tree (`source_sha b0244c82…`), which DISCHARGES the KNOWN STALE finding recorded in the paragraph below, for both rows. THE FLIP WAS DELIBERATE AND IS REVERTED: this marker was set to `releasing` in this lane's working tree, as a release action and not a lane convenience, with the FINAL `dist` on disk; `verify_custody_manifest --wallet-bundle-bytes .` then asserted all four pinned tools (four `==` lines, no mismatch) and reported `measured files=11 bytes=14103504 sha256=74dd2180b9d9abc2ed71449cde1eb86158d16ee9c61a78487b9fcf741c1d9ceb` with ZERO violations — its Rust `measure_bundle_dir` independently reproducing the same number the documented shell procedure at `:587-590` produced, which is the cross-check `bii_measurement_reproduces_the_records_own_documented_pipeline` exists to guarantee. The marker was returned to `held` in the same lane and `releasing` was NEVER committed. WHAT THIS DOES NOT DISCHARGE, carried forward rather than dropped on returning to `held`: (i) `[wallet_bundle]`'s digest is checker-evidenced by that run, and `[wallet_bundle_transitional]`'s is PACKET-EVIDENCED ONLY — `check_wallet_bundle_bytes` reads `doc.get(\"wallet_bundle\")` (`scripts/verify_custody_manifest/src/lib.rs:4347`), both tables record `path = \"wallet/dist\"`, and this marker is one bit with no per-bundle discriminator, so clause (3) below still stands and a B.1 lane still must NOT flip this