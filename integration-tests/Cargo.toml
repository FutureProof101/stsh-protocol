[dev-dependencies]
hmac = "=0.12.1"
toml          = "0.8"
pocket-ic     = { workspace = true }
# R-2 (C-30) AC-7a: the spawn-then-count ordering is bound to the AST, not to a
# substring — a substring oracle is satisfiable by a comment. Same dependency and
# same reason as `scripts/verify_memory_ids` and `scripts/verify_did_exports`.
syn           = { version = "2", features = ["full", "visit", "printing", "extra-traits"] }
candid        = { workspace = true }
# H-3 follow-up test only: build the raw management-canister install_code args with
# skip_pre_upgrade = Some(true) (PocketIC's upgrade_canister hardcodes Some(false)).
# Test/dev-dependency only — NEVER a production-crate dependency.
ic-management-canister-types = "0.7"
serde         = { workspace = true }
# P-MRK SSA P1: build the spend-circuit input for in-test proof generation from
# the tracked canonical fixture. Test-only; already in the workspace lock.
serde_json    = { workspace = true }
# Smoke-alarm tests: independent witness/certificate verification (CBOR hash
# tree per the IC certification spec) — deliberately NOT ic-certified-map.
serde_bytes   = { workspace = true }
serde_cbor    = { workspace = true }
sha2          = { workspace = true }

# ZK verifier — used in verifier_tests.rs to get compiled_vk_sha256() for pool init
# and proof_json_to_bytes() / public_json_to_signals() for loading real snarkjs artifacts.
# This is a host-side (non-Wasm) test dependency — verifier compiles to native on host.
stsh-verifier = { path = "../canisters/verifier" }

# DEF-111: the exact value-bound Merkle leaf hash the pool uses, to assert the deposit
# tree leaf binds the CREDITED (net) value, not the gross public_amount.
stsh-field-utils = { path = "../canisters/field-utils" }

# P-ARITH G-1/G-2: Gate-D/Gate-V verifier — gate_v_fixture_tests drives the
# SAME parsing/check logic the release CLI uses against a live PocketIC
# install (host tool; never a production-crate dependency).
verify-genesis-manifest = { path = "../scripts/verify_genesis_manifest" }
