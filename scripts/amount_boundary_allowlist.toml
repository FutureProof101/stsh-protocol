# =============================================================================
# Reviewed raw-amount boundaries — C4 §4 rule 2 (W3 3-1 D2)
# =============================================================================
# `verify_amount_boundaries` fails on any raw u128/i128 reachable from a public
# endpoint — directly, through a wrapper type, or through an install/init
# argument — that is not listed here.
#
# BUILDERS DO NOT ADD ROWS. A new raw-amount boundary is a STOP-and-refer: only
# CTO/SSA adjudication grants a reviewed entry (packet §3, F5). The rows below
# are exactly the C4 §4 rule-2 set, transcribed, each naming the gate that makes
# it safe.
#
# `path` is the exact traversal path the tool prints, so a row can never quietly
# cover a boundary other than the one it was written for.

# ── Rule-2 class 1: the gated staking lock/unlock pair ──────────────────────

[[amount]]
krate    = "canisters/token"
endpoint = "lock_for_staking"
path     = "amount: u128"
gate     = "caller-gated to the staking canister principal"
reason   = "C4 §4 rule 2, as transcribed: the gated lock/unlock pair. Not an open public boundary — an untrusted caller cannot reach it."

[[amount]]
krate    = "canisters/token"
endpoint = "unlock_from_staking"
path     = "amount: u128"
gate     = "caller-gated to the staking canister principal"
reason   = "C4 §4 rule 2, as transcribed: the gated lock/unlock pair."

# ── Rule-2 class 2: `stake`, on the documented self-consistency argument ────

[[amount]]
krate    = "canisters/staking"
endpoint = "stake"
path     = "amount: u128"
gate     = "self-consistency: the amount is debited from the caller's own balance, so an inflated value fails the transfer rather than crediting anything"
reason   = "C4 §4 rule 2, as transcribed: `stake` on the documented self-consistency argument."

# ── Rule-2 class 3: the `create_proposal` wrapper fields ────────────────────
# The three u128 fields rule 3 names explicitly: reached through ProposalType,
# never as direct parameters. They are the reason the wrapper case exists.

[[amount]]
krate    = "canisters/staking"
endpoint = "create_proposal"
path     = "proposal_type::ProposalType.TreasurySpend.amount: u128"
gate     = "proposal only — no value moves until a passed vote executes it"
reason   = "C4 §4 rule 2, as transcribed: the create_proposal wrapper fields on the same adjudication."

[[amount]]
krate    = "canisters/staking"
endpoint = "create_proposal"
path     = "proposal_type::ProposalType.RewardScheduleUpdate.new_emission_rate_per_day: u128"
gate     = "proposal only — no value moves until a passed vote executes it"
reason   = "C4 §4 rule 2, as transcribed: the create_proposal wrapper fields on the same adjudication."

[[amount]]
