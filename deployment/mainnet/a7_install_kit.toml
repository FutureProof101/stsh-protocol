# ── 9a. POOL VK ACTIVATION CEREMONY (PROT-24) — COMMENT ONLY, NOT AN ENTRY ───
#
# There is deliberately NO [[entry]] here: 9a installs nothing. It is recorded
# in this file only so a reader of the kit cannot finish the nine rows and
# believe the pool is ready.
#
# After row 8 the pool is still at PINNED_CIRCUIT_VERSION = 0
# (canisters/shielded-pool/src/lib.rs:3740) and EVERY spend is rejected
# CircuitVersionMismatch (:7951), while the shipped wallet bundle pins
# circuitVersion 3 and throws client-side before any private_spend is sent.
#
# The fix is a Vault 2-of-3 proposal, NOT an operator-page install:
#   variant { Application = variant { PoolScheduleVkActivation =
#     record { 3 : nat32; blob <32 bytes of 84dba305…acbc6914>;
#              <T> : nat64; <T+delta> : nat64 } } }
# (vault.did:141; custody-types/src/lib.rs:852). The operator page's V1 action
# surface is CLOSED and carries no Application variant, so there is no arg .bin
# and no expected_arg_hash for this step — nothing in this kit to upload.
# Activation is LAZY: after T passes, ONE private_spend call must be made (it
# may itself be rejected) before get_circuit_version() reads 3.
#
# Full procedure, read-backs and the ceremony-record fields: docs/
# A7_INSTALL_RUNBOOK.md §5a. SSoT V9.1 §8 item 9a. No kit edit is required —
# shielded_pool_init.did already names the Vault as governance controller.
