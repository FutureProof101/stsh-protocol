# source_sha is the commit whose tree these bytes were built from. The S10
# record commit is a CHILD of it and is Wasm-neutral: it adds this data file
# plus a test in scripts/verify_custody_manifest/tests/, neither of which is
# compiled into any canister crate. That neutrality is not asserted — it is
# demonstrated by the R2.6 rehearsal, which rebuilds from a clean root at the
# S10 commit and reproduces exactly the hashes below.
#
# ── source_sha SEMANTICS: RECORDED-ANCESTOR (S10 corrective r1) ──────────────
#
# AUTHENTICATED, not merely present. `check_release_identity` now verifies that
# source_sha (a) resolves to a real COMMIT OBJECT in this repository and (b) is
# an ancestor of — or equal to — the HEAD being checked
# (`check_source_provenance`, scripts/verify_custody_manifest/src/lib.rs).
#
# WHY ANCESTOR AND NOT EXACT-MATCH — this is forced, not preferred. The S10
# adjudication offered both. Exact-match (`source_sha == HEAD`) is unsatisfiable
# by construction: this record is a COMMITTED file, and a commit's SHA is a hash
# over the tree containing it, so no commit can record its own SHA. Requiring
# equality would fail on every commit that ever writes this record, including
# the final integrated commit. That is the child-commit self-reference, and it
# is solved here rather than used as an excuse to accept any string.
#
# WHAT THIS REJECTS: a fabricated value (the former `deadbeef` fixture) has no
# commit object; a real commit from an unrelated branch or repository is not an
# ancestor; a root with no usable git metadata fails closed rather than skipping.
#
# WHAT IT DOES NOT ESTABLISH, STATED: ancestry proves the recorded commit is
# genuinely in the history leading to the checked tree. It does NOT alone prove
# these bytes were produced at that commit — that binding comes from the
# artifact SHA-256 comparison plus the R2.6 reproductions. The cross-machine
# reproduction gap remains a disclosed holistic-review condition.
#
# The recorded [toolchain] versions are likewise authenticated against the
# ACTIVE rustc/cargo at check time (`check_tool_version`). Because this
# repository pins no toolchain (see the named gap above), that check is more
# necessary, not less: nothing else would notice a version copied from another
# machine.

