# =============================================================================
# Canister census — the universe for the did-vs-exports gate (W3 3-1 D1.1)
# =============================================================================
# This file, not a glob, is the universe. Every directory under `canisters/`
# with a Cargo.toml appears here exactly once, enrolled or excluded BY NAME with
# a reason; `verify_did_exports` hard-fails on any crate it finds that is absent
# from this list, so "we forgot one" is not a reachable state.
#
# THE 13-vs-12 COUNT DIES HERE (packet §1.1). The count was ambiguous because it
# depended on whether `canisters/vetkeys` — a standalone, non-member crate — was
# being counted, and on whether `stub-bad-fee-token`, which exposes endpoints but
# ships no tracked .did, was expected to have one. The answer is a named list:
#   13 tracked `.did` files live under `canisters/*/` and all 13 are in scope
#   below. 5 crates have no `.did`: 4 library crates (custody-types, eager-cell,
#   fee-policy, field-utils) and 1 test-only stub (stub-bad-fee-token).
#   13 in scope + 5 excluded = 18 crates under canisters/.
#
# `src/declarations/*` and `canisters/custody-types/tests/fixtures/did/*` are
# generated/fixture copies, not tracked interface sources, and are not canisters.

