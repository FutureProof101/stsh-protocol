#
# Authority: CTO_BOARD_RECONCILED_2026-09-11.md (5b7350d5) D1 row "vetkeys
# installed at A-7"; MAINNET_DEPLOYMENT.md:375/:418 (adjudication b216902b…,
# 2026-08-27). The in-repo "D1, 2026-08-14" references are the STAKING
# exclusion — a different ruling, and NOT authority for this row.
#
# VETKEYS-AGE-2MIN (2026-09-23): `wasm_sha256` REBOUND from b51a8436… — the A-7
