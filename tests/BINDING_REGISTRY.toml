# ── B-5-REBOOTSTRAP-SIGNATURE (R-8 V1a, CTO ruling
# cto-ruling-r8-landed-diff-fix-wave-2026-09-06 item 1, closing SSA RED-1) ────
#
# `authorize_re_bootstrap` is the ONE endpoint that can re-open the bootstrap
# path for a principal that has revoked its way to zero devices. It verifies the
# approval's signature against the issuing device's stored signing key, over a
# transcript rebuilt with its OWN action label. That verify was correct and
# UNBOUND at fdbde43a: stripping `verify::verify_transcript` REDded nothing in
# the whole vetkeys suite, and a forged 64-byte signature was accepted — because
# every committed test signed VALIDLY, and the one negative arm was refused by
# `check_issuer`'s STATUS check, a different predicate.
#
# The bound test presents FOUR approvals to the same endpoint: forged bytes from
# an ACTIVE issuer (only the verify can refuse it), a cryptographically VALID
# signature replayed from a `RevokeV1` transcript (only the ACTION LABEL differs,
# which is what binds the label), a valid signature from a REVOKED device, and
# the genuine one — accepted, so the refusals are not vacuous.
#
# NOTE the method warning that produced this row: the vetkeys suite installs a
# PREBUILT Wasm, so a source mutation with no rebuild is INERT and the suite
# passes for the wrong reason. Any mutation evidence against this row must state
# the rebuild between the edit and the run.
[[binding]]
id         = "B-5-REBOOTSTRAP-SIGNATURE"
property   = "authorize_re_bootstrap"
status     = "closed"
bound      = "l04_07_forged_or_replayed_signature_cannot_authorize_re_bootstrap"
test_crate = "vetkeys"
test_file  = "canisters/vetkeys/tests/crossdevice_acceptance.rs"

# ── B-3-INTENT-* — a diverging retry under a live spend_id is a CONFLICT ─────
