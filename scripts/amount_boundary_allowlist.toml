# ── Rule-2 class 4: deploy-time init allocations ────────────────────────────
# RULED BROAD — CTO ruling W3 3-1 amount-boundary adjudication V2 (8945c2ad…,
# A1-concurred) §1. Rule 2's "deploy-time `init` allocations" covers ALL
# deploy-time amount parameters carried in the install argument, allocation-
# shaped or not: the safety property rule 2 blessed is the CHANNEL, not the
# field's shape. Install arguments are settable only by the installing
# controller and are Gate-D-defended. The two rows the builder flagged
# (staking::init `initial_emission_rate_per_day` and
# `governance_params.min_proposal_deposit`) stay in this class; no rows moved.

