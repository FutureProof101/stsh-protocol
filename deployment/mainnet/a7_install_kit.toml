# =============================================================================
# STSH — A-7 INSTALL KIT  (lane A-7, 2026-09-12)
# =============================================================================
#
# The machine-readable half of the A-7 install kit: one row per canister the
# Owner installs through the wallet's `#/operator` page. The human half is
# docs/A7_INSTALL_RUNBOOK.md; the two are written together and must stay
# together.
#
# RR-1b (2026-09-13) ADDED THE TWO GENESIS ROWS — `stsh_token` (order 6) and
# `vesting` (order 7) — so all NINE J-18 births are now installed under the same
# reviewed, hashed, replayable discipline. They were the last two installs whose
# arguments would otherwise have been carried to the console by hand. Their
# `.did` files are the Gate-D genesis artifacts, unchanged by this kit; the kit
# adds the encode, the hashes and the operator wiring. `shielded_pool` and
# `smoke_alarm_monitor` moved from order 6/7 to 8/9 to make room — the order is
# duplicate-checked, and the ordering itself is load-bearing: the token before
# vesting (the vesting init names the token and the vesting account is minted by
# the token install), and the pool after the token.
#
# WHY THIS FILE EXISTS. J-18 birthed nine canisters under the Vault
# (office record RECORD_J18_VAULT_BIRTHS_2026-09-12.md). Before this lane only
# vault / upgrader / stsh_token / vesting had a committed init artifact, so for
# the other seven there was nothing to hash, review, or replay — the Owner would
# have typed install arguments by hand at the console. Hand-reconstructed init
# args are a Gate-D violation; this kit extends that discipline to every install.
#
# HOW THE OPERATOR PAGE USES IT. The page takes a target principal, a Wasm file,
# an arg file, an `expected_wasm_hash` and an `expected_arg_hash`. It uploads the
# RAW BYTES of both files and performs NO CANDID ENCODING
# (wallet/src/ui/pages/operator.ts:664-667; wallet/src/operator/proposals.ts
# `codePayload`). The Vault recomputes sha256 over exactly those bytes at
# propose AND at execute, then forwards them as the install argument. Therefore:
#
#     the Owner uploads  <canister>_init.bin
#     expected_arg_hash  = `arg_sha256` below  = sha256 of that .bin
#     expected_wasm_hash = `wasm_sha256` below = the [wasm.*] pin
#
# The page displays a LOCAL sha256 for the Wasm only (operator.ts:628-636) —
# never for the arg file. The runbook therefore has the Owner run
# `sha256sum <file>.bin` before typing `expected_arg_hash`; this table is what
# that number is checked against.
#
# `arg_text_sha256` is the hash of the reviewable Candid TEXT. It is recorded so
# a review can be pinned to an exact document, but it is NOT what the page or
# the Vault hashes — do not type it anywhere.
#
# ENCODER. `candid_parser` 0.1.4 (the parser/type-checker crate that `didc`
# itself is built on), invoked IN-PROCESS by
# `scripts/verify_custody_manifest/src/bin/verify_a7_kit.rs`. The encode path is
# `pretty_check_file(<canister>.did)` → the `service : (…)` init type →
# `parse_idl_args(<canister>_init.did)` → `to_bytes_with_types`, which is
# exactly `didc encode -d <canister>.did -t '<init_type>'`. It is in-process
# rather than a shelled-out `didc` binary deliberately: `didc` is not installed
# in this environment and a gate stage that depends on an unpinned external
# binary is a check whose absence is invisible. The SAME path produces the .bin
# and verifies it, and the gate re-runs the verification on every run.
#
# VERIFIED BY: `cargo run -p verify-custody-manifest --bin verify_a7_kit`,
# a BLOCKING stage of ./run_gate.sh. It re-encodes each `.did` against the
# canister's own interface and requires byte-identity with the committed `.bin`,
# re-derives both hashes, resolves every principal against the nine J-18 births,
# the Vault, and every RESOLVED role in deployment/mainnet/genesis_principals.toml
# — the committed, byte-pinned genesis principal record, read at point of use
# rather than mirrored into the tool, because the genesis rows added at RR-1b
# carry holder principals that are not canisters; the literal "PENDING" is a
# role's fail-closed marker and is never admitted — cross-checks each
# `wasm_sha256` against release_hashes.toml,
# and enforces the shielded_pool hold in BOTH directions.
#
# PENDING ROWS ELSEWHERE ARE UNCHANGED. `custody_manifest.toml` rows whose
# `launch_value = "PENDING(...)"` stay PENDING text after A-7; rebinding them is
# a separate record lane, not this one. The pool's `verifier_canister` is
# declared there as `authority_field VERIFIER_CANISTER` (init-writable) and is
# supplied by shielded_pool_init.did — that is the cross-reference, not an edit.
#
# FEE ACTIVATION IS NOT AN INSTALL STEP. The pool installs on fee-free
# launch_defaults; nonzero fees arrive later as a PoolSetGovernanceFeeParams
# governance proposal (A-5/A-6).
#
# NOTE — THREE IDENTICAL ARG FILES. verifier, merkle_tree and nullifier_registry
# all take `(principal)` = the pool, so their three .bin files are byte-identical
# and share the arg sha256 18d4539b…. That is correct, and it is also a trap:
# the arg hash cannot distinguish the three installs. The TARGET principal is the
# only thing that does. Check the target twice.
# =============================================================================

schema_version = 1
encoder = "candid_parser 0.1.4 (in-process, via scripts/verify_custody_manifest/src/bin/verify_a7_kit.rs)"

