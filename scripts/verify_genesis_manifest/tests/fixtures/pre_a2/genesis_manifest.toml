#
# `principal` is the genesis vesting canister — deliberately the SAME principal the
# `founders` row carries, because that canister is the schedule authority for both.
# The roles stay DISTINCT (`LEGAL_COUNSEL_VESTING` vs `FOUNDERS_VESTING_CANISTER`);
