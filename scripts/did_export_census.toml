# ── Named, dated did-vs-exports drift exceptions (packet §3) ─────────────────
# Amount-boundary findings are NEVER excepted here — they STOP and refer up.

[[exception]]
krate  = "canisters/verifier"
kind   = "export_missing_from_did"
method = "verify_spend_canister_benchmark"
date   = "2026-08-15"
reason = "DESIGNED omission, not drift: canisters/verifier/src/lib.rs:718-723 and verifier.did's own header both state the benchmark endpoint is deliberately outside the production interface, and DEF-083 gates it to the authorized pool caller, so it is not a public verification oracle (the caller gate is exercised negatively by `umc31_proof_endpoints_refuse_every_non_pool_caller`). Recorded here rather than fixed — this lane must not touch canisters/ or .did files (packet §3). Enrolled by the W3 3-1 builder at pin 86c56f7; the gate's name-set bar cannot distinguish a deliberate omission from drift, so the distinction lives in this dated row."
