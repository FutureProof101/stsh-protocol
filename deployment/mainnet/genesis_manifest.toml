[pool_init]
# W-VKGATE (AR1-05 CRITICAL / register C-27). The shielded pool's init trust
# roots, so Gate-D verifies them FIELD-BY-FIELD exactly as it already does for
# token_init and vesting_init. Before this section the pool's verifying-key pin
# — the root of its whole soundness story — was verified by nothing, and the
# only protection against installing against the dev key was runbook prose.
#
# ARMED at lane A-4 (2026-09-12). This is the LAUNCH verifying key: the P0-3
# all-zeros placeholder is gone, and this field is now the pool's PINNED_VK_HASH
# at init (seeded through InitArgs::initial_vk_hash — the pool has no VK source
# constant of its own).
#
# Provenance, generation `mainnet-v2`:
#   phase 1  PUBLIC Hermez powers-of-tau, powersOfTau28_hez_final_15.ptau
#            (54 named contributors + beacon), pinned on the publisher-attested
#            blake2b-512 AND its sha256.
#   phase 2  ONE operator contribution ("FutureProof operator 2026-09-12")
#            finalized by the pre-announced public drand beacon, mainnet chain
#            round 6460200 (iterationsExp 10) — the LAST contribution.
# Evidence: docs/ceremony/CEREMONY_RECORD_v3.md (pinned byte-for-byte by
# VK_PIN.toml.record_transcript, checked by DPOOL-8b).
#
# This value MUST equal sha256(circuits/verification_key.json) == the verifier's
# compiled_vk_sha256() == VK_PIN.toml.sha256 == the wallet's PINNED_VK_HASH_D2.
# DPOOL-9 hashes the VK file and requires that equality, so a drift here fails
# the gate before any wallet leg runs.
#
# ARMING THIS FIELD FLIPS A POSTURE: DPOOL-9b is gated on DPOOL-1b, so with the
# placeholder gone VK_PIN.toml must now declare label = "PRODUCTION", not "DEV".
#
# DPOOL-2 still REFUSES the M5 single-participant dev hash
# (fc73ca4dcdcfd5a2eb0dd6165c5cf2b1e039c3acdad2d360258c5d42ba530dc8) in this
# field — the manifest-side counterpart of the pool's DENY_VK_HASH init trap.
# Refusing one known-bad value is not provenance: any other hash passes. NOTE
# the disclosed residual (record §8): that deny literal is the PRE-A-3 dev VK and
# no longer names the live dev key, so the deny list would not catch an
# accidental arming with the A-3 dev VK (081e9e9b…). The protections that DO
# catch it are E14 and the C5/DPOOL-9 equality chain above.
vk_hash         = "84dba3059c1fb15080cd2d1c5b9a1eefbfea7f3b0321e1297d83ad56acbc6914"
proof_system    = "groth16-bn254"
ceremony_record = "docs/ceremony/CEREMONY_RECORD_v3.md"
# Trust roots, cross-checked against the record that already owns each one.
#
# AMENDED 2026-09-13 by RULING_RECORD_POOL_TRUST_ROOTS_2026-09-13 (A-7 REBASE).
# RR-1a wrote treasury_canister and controller to the sources the PRE-amendment
# DPOOL-5/7 named — token_init.treasury and vesting_init.controller. Those two
# equalities were a GATE DEFECT: they conflated the ledger's treasury ACCOUNT
# holder with the treasury CANISTER, and the VESTING controller multisig with
# the POOL's controller. The pool's own code settles both — treasury_disburse
# requires `caller == TREASURY_CANISTER` and the pool CALLS that canister
# (shielded-pool/src/lib.rs:6235, :13113), and `controller` gates the pool's
# reconcile endpoints (:8909), which custody_manifest.toml binds to the VAULT.
#
#   token_canister    == vesting_init.token_canister          (DPOOL-4)
#   treasury_canister == a7_install_kit.toml [treasury].target (DPOOL-5, amended)
#                        — the treasury CANISTER's D5 born-under-vault principal.
#                        token_init.treasury (the TREASURY_MULTISIG holder) is
#                        now REFUSED here by name.
#   staking_canister  == token_init.staking_canister          (DPOOL-6 — pinned
#                        to the VAULT at RR-1, never to a staking canister;
#                        freeze §14. Unchanged.)
#   controller        == vault_authorities.toml [recovery].vault (DPOOL-7,
#                        amended) — the Vault. vesting_init.controller is now
#                        REFUSED here by name.
#   DPOOL-5b additionally refuses any P0-3 placeholder literal in all four
#   fields: they are not principal_sites, so the DP3 family never scans them and
#   DPOOL-4..7 are their only coverage.
#
# [token_init].treasury STAYS the TREASURY_MULTISIG holder and
# vesting_init.controller stays the VESTING_CONTROLLER multisig — neither moved
# (ruling §2; CUSTODY_DECISION.md Option 2 keeps the treasury canister out of
# custody of real STSH, so the allocation recipient is the multisig).
token_canister    = "clv7x-haaaa-aaaar-qchha-cai"
treasury_canister = "cqqds-5yaaa-aaaar-qchfq-cai"
staking_canister  = "cpdab-saaaa-aaaar-qca2q-cai"
controller        = "cpdab-saaaa-aaaar-qca2q-cai"

