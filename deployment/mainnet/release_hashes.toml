#
#   cd wallet && find dist -type f | sed 's|^dist/||' | LC_ALL=C sort \
#     | while read -r f; do printf "%s  %s\n" \
#         "$(sha256sum "dist/$f" | cut -d' ' -f1)" "$f"; done \
