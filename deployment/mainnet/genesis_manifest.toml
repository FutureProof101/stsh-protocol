# =============================================================================
# STSH — CANONICAL GENESIS MANIFEST (approved template: P-ARITH brief §0.3 V1.5)
# =============================================================================
#
# THE single source of truth for genesis token distribution + init wiring.
# MAINNET_DEPLOYMENT.md points here; Gate-D (scripts/verify_genesis_manifest)
# verifies the canonical init artifacts (stsh_token_init.did /
# vesting_init.did) against THIS file, field by field, before any deploy.
#
# PRINCIPALS RESOLVED AT RR-1a (2026-09-12) AND RE-BOUND AT RR-1b REDO
# (2026-09-21). Every principal below is the ruled PRODUCTION principal, bound to
# deployment/mainnet/genesis_principals.toml. The allocation holders are dfx
# identities attested by reviews/RECORD_GENESIS_HOLDER_PRINCIPALS_2026-09-12.md
# (f27472f8…); the TWO Internet-Identity beneficiary roles are attested
# PER ROLE — FOUNDER_1_BENEFICIARY by
# reviews/RECORD_FOUNDER_1_BENEFICIARY_NATIVE_2026-09-21.md (987805a1…) and
# LEGAL_COUNSEL_BENEFICIARY by
# reviews/RECORD_LEGAL_COUNSEL_BENEFICIARY_NATIVE_2026-09-21.md (e9d4a04e…),
# both carrying their CANISTER-ROOTED (s3tyu native-origin) values after the
# WT-1 derivationOrigin cutover. The pre-cutover `app.stsh.fi` values are
# ALIASES and are retired. The record declares `rr1_performed = true`. NO placeholder principal remains
# in this file; Gate-D certifies this set and its posture stage is the STRICT
# one, satisfied only by an EXACTLY EMPTY failing set. The retired placeholder set kept every role
# DISTINCT so the cross-artifact binding checks were provable at fixture level
# (Builder DoD AR-5/AR-6); GP4-distinct now proves it over the real values.
#
# Locked decisions transcribed here (no builder discretion):
# - Σ = 1,000,000,000 STSH = 100,000,000,000,000,000 (10^17) base units.
#   UNCHANGED by D-4: the legal-counsel grant is funded from bucket 4
#   (Strategic Contributors), not minted, and NOT from treasury — see the
#   `legal_counsel` row.
# - Row percentages are BASIS POINTS (`percent_bps`), summing to 10,000 — NOT
#   integer percent. The D-4 legal-counsel grant is 0.5% (50 bps) and the
#   bucket-4 remainder is 4.5% (450 bps); neither is representable as an integer
#   percent, which is why the field moved. `percent_bps` is AUDIT METADATA ONLY: it appears in
#   no init artifact and in no canister — minting is driven by
#   `amount_base_units` alone. Where the two could ever disagree, THE AMOUNT WINS
#   and the discrepancy is a defect.
# - `subaccount = null` on every allocation (single canonical form).
# - `created_at_genesis = false`, `genesis_timestamp_ns = 0` in the artifact
#   (the canister overwrites both during init).
# - `lock_policy` is AUDIT METADATA; enforcement = custody principal/controller
#   (founders: the external vesting canister + Gate-V).
# - `vesting_policy = null` on EVERY row incl. founders — the vesting canister
#   + Gate-V are the authoritative schedule (no second source of truth).
# - Vesting custody at genesis = `founders` ONLY; `ceremony_rewards` funds
#   CEREMONY_HOLDING (post-ceremony grants), NOT genesis vesting.
# - THE ALLOCATION TABLE IS V4 D-0 AS AMENDED BY D-4/D-5 (lane A-2, 2026-09-09,
#   Owner ruling C-15 = GO). Its authority is
#   CANONICAL/STSH_TOKENOMICS_V4_RULINGS_2026-07-28.md §D-0, never this file and
#   never scripts/verify_genesis_manifest's APPROVED_ALLOCATIONS: that constant
#   is re-typed FROM the rulings, not FROM here (the E-6 self-inheritance defect).
# - Founder schedules: ONE (DRIFT-1). Founders shape LOCKED (§0.4 Option A): cliff 6 + linear 30 (fully vested
#   month 36), continuous linear on fixed 30-day months.

schema_version = 3

[token]
ticker = "STSH"
decimals = 8
total_supply_base_units = 100000000000000000   # 10^17

[token_init]
