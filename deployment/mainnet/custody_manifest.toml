# snapshot for stsh.fi (apex, www, every relevant record), which L0 cannot
# obtain without mainnet/network access. Declared here with its completeness
# claim; contributes NO candidates until populated. A pending source never
# fails coverage, and "pending" is never silently treated as "empty"
# (freeze §13.2 RR-2).
status = "pending"
declared_complete_for = ["custom_domain_bound_canisters"]
blind_to = "canisters with no custom domain, or a zone snapshot that failed to obtain"
candidates = []

[sources.d4]
