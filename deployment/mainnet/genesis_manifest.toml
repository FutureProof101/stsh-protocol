# token_canister == the token being deployed; controller == the approved
# production controller manifest; founders_vesting_canister == the principal
# receiving the `founders` allocation. Every founder schedule uses
# cliff_months = 6, linear_months = 30 (§0.4 Option A, LOCKED).
token_canister            = "clv7x-haaaa-aaaar-qchha-cai"   # STSH_TOKEN_CANISTER (RR-1a)
controller                = "fshhc-2gwwz-ppjrt-3kzea-xt3l6-oemkp-6vkjz-soogu-e5y55-qolw4-wae"   # VESTING_CONTROLLER_MULTISIG (RR-1a)
